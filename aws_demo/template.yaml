AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Battery-aware MPC-ACC demo. Runs the paper's energy model, ACC and MPC on an uploaded speed trace. Deploy ONLY through this template.

Parameters:
  AlertEmail:
    Type: String
    Description: Email that gets the budget alert
  MonthlyBudgetUSD:
    Type: Number
    Default: 1
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Website origin allowed to call the API (use your GitHub Pages / subdomain URL once known)

Resources:
  SimulateLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  SimulateFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 2048
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref SimulateLogs
      Events:
        Simulate:
          Type: HttpApi
          Properties:
            ApiId: !Ref DemoApi
            Method: POST
            Path: /simulate
    Metadata:
      Dockerfile: aws_demo/app/Dockerfile
      DockerContext: ..
      DockerTag: v1

  DemoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: ev-mpc-acc-demo
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  SimulateUrl:
    Description: Paste this into web/config.js as API_URL
    Value: !Sub 'https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/simulate'
